{% extends "base_auth.html" %}
{% block title %}Mot de passe modifié — PharmaGest{% endblock %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow" style="width: 400px;">
    <div class="card-body p-4 text-center">
      <h3 class="text-success mb-4">Mot de passe modifié !</h3>
      <p class="text-muted">Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
      <a href="{% url 'utilisateurs:login' %}" class="btn btn-success w-100">Se connecter</a>
    </div>
  </div>
</div>
{% endblock %}
