{% extends "base_auth.html" %}
{% block title %}Connexion — PharmaGest{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center"
  style="min-height: 100vh; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);">
  <div class="card shadow-lg border-0" style="width: 420px; border-radius: 15px; overflow: hidden;">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <div
          class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow"
          style="width: 70px; height: 70px;">
          <i class="bi bi-capsule fs-1"></i>
        </div>
        <h3 class="fw-bold mb-1">PharmaGest</h3>
        <p class="text-muted">Connectez-vous à votre espace</p>
      </div>

      {% if form.errors %}
      <div class="alert alert-danger border-0 small py-2">
        <i class="bi bi-exclamation-circle me-1"></i> Identifiants incorrects.
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label fw-bold small text-muted text-uppercase">Nom d'utilisateur</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control bg-light border-0"
              placeholder="Entrez votre identifiant" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold small text-muted text-uppercase">Mot de passe</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control bg-light border-0"
              placeholder="Entrez votre mot de passe" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
          Se connecter
        </button>
      </form>

      <div class="text-center mt-3">
        <a href="{% url 'password_reset' %}" class="text-muted small text-decoration-none hover-primary">Mot de passe
          oublié ?</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
