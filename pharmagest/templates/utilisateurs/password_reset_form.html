{% extends "base_auth.html" %}
{% block title %}Mot de passe oublié — PharmaGest{% endblock %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow" style="width: 400px;">
    <div class="card-body p-4">
      <h3 class="text-center mb-4">Mot de passe oublié</h3>
      <p class="text-muted text-center small">Entrez votre adresse e-mail pour recevoir un lien de réinitialisation.</p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Adresse e-mail</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Envoyer le lien</button>
      </form>
      <div class="text-center mt-3">
        <a href="{% url 'utilisateurs:login' %}" class="text-muted small">Retour à la connexion</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
