{% extends "base_auth.html" %}
{% block title %}Email envoyé — PharmaGest{% endblock %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow" style="width: 400px;">
    <div class="card-body p-4 text-center">
      <h3 class="text-success mb-4">E-mail envoyé !</h3>
      <p class="text-muted">Si un compte existe avec cet e-mail, vous recevrez un lien pour réinitialiser votre mot de
        passe.</p>
      <a href="{% url 'utilisateurs:login' %}" class="btn btn-success w-100">Retour à la connexion</a>
    </div>
  </div>
</div>
{% endblock %}
